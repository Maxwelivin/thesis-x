name = "thesis-x-wright"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# 允許呼叫的網站（逗號分隔）。通關密語與金鑰不要寫在這裡，用 wrangler secret 設定。
ALLOWED_ORIGINS = "https://maxwelivin.github.io"
# MODEL = "gemini-3.5-flash-lite"
# DAILY_LIMIT = "200"

# 想要每日上限的話：wrangler kv namespace create LIMITS，再把輸出的 id 填進來並取消註解
# [[kv_namespaces]]
# binding = "KV"
# id = "貼上 id"

# Gemini 免費層不支援部分地區（例如從台灣機房出去會被擋）。指定 Worker 在美國執行，往 Gemini 的請求就從美國發出
[placement]
region = "aws:us-east-1"
